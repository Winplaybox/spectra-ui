name: Release & Publish Packages

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_npm:
        description: 'Publish packages to NPM registry'
        required: true
        type: boolean
        default: true
      dist_tag:
        description: 'NPM distribution tag (e.g. latest, beta, next)'
        required: false
        type: string
        default: 'latest'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  build-and-release:
    name: Build & Package Spectra UI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release readiness
        run: pnpm run release:check

      - name: Build design tokens & packages
        run: pnpm run build

      - name: Package all release tarballs (.tgz)
        run: pnpm run pack:packages

      - name: Upload release packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: spectra-ui-release-packages
          path: dist-packages/*.tgz
          retention-days: 30

      - name: Publish packages to NPM
        if: ${{ (github.event_name == 'release' || github.event_name == 'push' || inputs.publish_npm == true) }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning ::NPM_TOKEN secret is not set in this repository. Skipping npm publish."
            echo "To enable automated publishing, add NPM_TOKEN to your GitHub repository secrets (Settings > Secrets and variables > Actions)."
          else
            echo "🔑 Publishing 6 Spectra UI packages to npm with tag: ${{ inputs.dist_tag || 'latest' }}..."
            for pkg in dist-packages/*.tgz; do
              echo "Publishing $pkg..."
              npm publish "$pkg" --access public --tag "${{ inputs.dist_tag || 'latest' }}" --provenance
            done
            echo "🎉 All packages successfully published to NPM!"
          fi

      - name: Upload packages to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: dist-packages/*.tgz
          generate_release_notes: true
